<text x="582.0" y="64.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0c0d0d" text-anchor="start">Fin del turno</text>
<text x="582.0" y="82.0" font-family="'Geist Mono', SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#666d69" text-anchor="start">Stop</text>
<text x="582.0" y="106.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#595f5c" text-anchor="start">Audita el diff desde</text>
<text x="582.0" y="122.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#595f5c" text-anchor="start">lo último aprobado</text>
<text x="582.0" y="138.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#595f5c" text-anchor="start">y pasa el revisor</text>
<path d="M648.0,158 L648.0,196 L506,196" stroke="#dddcd5" stroke-width="1" fill="none"/>
<text x="206" y="200" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666d69"><tspan font-weight="600" fill="#4e700d">Aprobado</tspan> · pasa la auditoría</text>
<path d="M648.0,158 L648.0,222 L506,222" stroke="#dddcd5" stroke-width="1" fill="none"/>
<text x="206" y="226" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666d69"><tspan font-weight="450" fill="#595f5c">Otra ronda</tspan> · el modelo corrige; hasta 3</text>
<path d="M648.0,158 L648.0,248 L506,248" stroke="#dddcd5" stroke-width="1" fill="none"/>
<text x="206" y="252" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#666d69"><tspan font-weight="450" fill="#895b00">Retenido</tspan> · aceptar, deshacer o pedir arreglo</text>
<rect x="24" y="290" width="702" height="56" rx="8" fill="none" stroke="#d1cfc8" stroke-dasharray="4 3"/>
<text x="40.0" y="313.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#595f5c" text-anchor="start">Punto de control: un git propio en .sens/canon/checkpoints, sin tocar el .git del proyecto.</text>
<text x="40.0" y="333.0" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#595f5c" text-anchor="start">Cada turno nace sin aprobar: solo lo aprueban una auditoría que pasa o la persona.</text>
</svg>
