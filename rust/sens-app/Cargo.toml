[package]
name = "sens-app"
version = "0.27.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sens-agent = { path = "../sens-agent" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22"
ignore = "0.4.33"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
tar = "0.4"
flate2 = "1"
minisign-verify = "0.2.5"
sha2 = "0.10"
toml = "1"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
cpal = "0.18"
whisper-rs = "0.16"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security_Cryptography", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"

[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.release.package.whisper-rs-sys]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
